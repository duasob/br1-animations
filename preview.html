<!doctype html>
<html lang="en">
    <!--
        Local preview host for br1-animations.

        Usage: serve this folder, then open
            preview.html?anim=your-anim.js
        (no ?anim= previews the example animations).

        Theme variables come from theme.css; on the br1.me site a one-line
        stub imports the live site palette instead.
    -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>br1-animations · preview</title>
        <link rel="stylesheet" href="theme.css" />
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.25rem;
                background: var(--bg);
                color: var(--text);
                font-family: "EB Garamond", Georgia, "Times New Roman", serif;
                transition:
                    background 0.25s ease,
                    color 0.25s ease;
            }

            .tabs {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .tabs button {
                font: inherit;
                font-size: 1rem;
                padding: 0.3rem 0.9rem;
                border: 1px solid var(--border);
                border-radius: 999px;
                background: transparent;
                color: var(--secondary);
                cursor: pointer;
                transition:
                    color 0.15s ease,
                    border-color 0.15s ease;
            }

            .tabs button:hover {
                color: var(--accent);
                border-color: var(--accent);
            }

            .tabs button.active {
                color: var(--bg);
                background: var(--accent);
                border-color: var(--accent);
            }

            #stage {
                position: relative;
                width: min(70vmin, 640px);
                height: min(70vmin, 640px);
            }

            #stage canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            .panel {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
                width: min(70vmin, 640px);
                min-height: 1rem;
            }

            .panel .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                font-size: 0.95rem;
                color: var(--secondary);
            }

            .panel .row label {
                display: flex;
                align-items: baseline;
                gap: 0.6rem;
            }

            .panel .row .val {
                color: var(--text);
                font-variant-numeric: tabular-nums;
            }

            .panel input[type="range"] {
                accent-color: var(--accent);
                width: 45%;
            }

            .panel .empty {
                font-size: 0.9rem;
                color: var(--dim);
            }

            #themeToggle {
                position: fixed;
                top: 1rem;
                right: 1rem;
                font: inherit;
                font-size: 0.95rem;
                padding: 0.25rem 0.85rem;
                border: 1px solid var(--border);
                border-radius: 999px;
                background: transparent;
                color: var(--secondary);
                cursor: pointer;
            }

            #themeToggle:hover {
                color: var(--accent);
                border-color: var(--accent);
            }
        </style>
    </head>

    <body>
        <button id="themeToggle" type="button">Dark</button>
        <div class="tabs" id="tabs"></div>
        <div id="stage"></div>
        <div class="panel" id="panel"></div>

        <script>
            // Load animation files from the query string (?anim=a.js,b.js),
            // falling back to the examples. Injection is deferred to
            // DOMContentLoaded so utils/_shared.js below has executed first.
            (function () {
                const q = new URLSearchParams(location.search).get("anim");
                const files = q
                    ? q.split(",").map((s) => s.trim()).filter(Boolean)
                    : ["lorenz.js", "field.js", "tiles.js"];
                window.addEventListener("DOMContentLoaded", () => {
                    for (const f of files) {
                        const s = document.createElement("script");
                        s.src = f;
                        document.body.appendChild(s);
                    }
                });
            })();
        </script>
        <script src="utils/_shared.js"></script>
        <script src="preview-host.js"></script>
    </body>
</html>
